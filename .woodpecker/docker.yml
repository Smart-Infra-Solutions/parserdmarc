# Build et publication de l'image Docker sur Docker Hub.
#   - push sur main : publie l'image `latest`
#   - tag           : publie l'image taguée (latest + version)
#
# Ne démarre QUE si la pipeline `test` a réussi (depends_on).
when:
  - event: [push, pull_request, tag]

depends_on:
  - test

steps:
  - name: build
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: smartinfrasolutions/parserdmarc
      platforms: linux/amd64
      # Publication de l'image `latest` à chaque push sur main.
      tags:
        - latest
      username: smartinfrasolutions
      password:
        from_secret: docker_token
    when:
      - event: push
        branch: main

  - name: publish
    image: woodpeckerci/plugin-docker-buildx
    settings:
      # Docker Hub est le registre par défaut du plugin : pas besoin de `registry`.
      repo: smartinfrasolutions/parserdmarc
      platforms: linux/amd64,linux/arm64
      tags:
        - latest
        - ${CI_COMMIT_TAG}
      username: smartinfrasolutions
      # Définissez le secret `docker_token` dans Woodpecker (Settings > Secrets) :
      # un access token Docker Hub (Account Settings > Security > New Access Token).
      password:
        from_secret: docker_token
    when:
      - event: tag
