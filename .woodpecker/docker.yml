# Build de l'image Docker (publication sur Docker Hub).
#   - push/PR : build de vérification (dry-run, pas de publication)
#   - tag     : build + publication vers docker.io/smartinfrasolutions/parserdmarc
#
# Ne démarre QUE si la pipeline `test` a réussi (depends_on).
when:
  - event: [push, pull_request, tag]

depends_on:
  - test

steps:
  - name: build
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: smartinfrasolutions/parserdmarc
      platforms: linux/amd64
      dry-run: true
    when:
      - event: [push, pull_request]

  - name: publish
    image: woodpeckerci/plugin-docker-buildx
    settings:
      # Docker Hub est le registre par défaut du plugin : pas besoin de `registry`.
      repo: smartinfrasolutions/parserdmarc
      platforms: linux/amd64,linux/arm64
      tags:
        - latest
        - ${CI_COMMIT_TAG}
      username: smartinfrasolutions
      # Définissez le secret `docker_token` dans Woodpecker (Settings > Secrets) :
      # un access token Docker Hub (Account Settings > Security > New Access Token).
      password:
        from_secret: docker_token
    when:
      - event: tag
