# Build et publication de l'image Docker sur GitHub Container Registry (ghcr.io).
#   - push sur main : publie l'image `latest`
#   - tag           : publie l'image taguée (latest + version)
#
# Ne démarre QUE si la pipeline `test` a réussi (depends_on).
when:
  - event: [push, pull_request, tag]

depends_on:
  - test

steps:
  - name: build
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      # Le nom d'image ghcr.io doit être en minuscules.
      repo: ghcr.io/smart-infra-solutions/parserdmarc
      platforms: linux/amd64
      # Publication de l'image `latest` à chaque push sur main.
      tags:
        - latest
      username: Ch1ch1
      password:
        from_secret: ghcr_token
    when:
      - event: push
        branch: main

  - name: publish
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      repo: ghcr.io/smart-infra-solutions/parserdmarc
      platforms: linux/amd64,linux/arm64
      tags:
        - latest
        - ${CI_COMMIT_TAG}
      username: Ch1ch1
      # Définissez le secret `ghcr_token` dans Woodpecker (Settings > Secrets) :
      # un Personal Access Token GitHub (classic) avec le scope `write:packages`
      # (Settings > Developer settings > Personal access tokens).
      password:
        from_secret: ghcr_token
    when:
      - event: tag
